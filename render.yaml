services:
  # O Banco de Dados PostgreSQL
  - type: pgbd
    name: lexfinance-db
    plan: free # ou starter se precisar de estabilidade
    postgresMajorVersion: 16

  # O Servidor Node.js
  - type: web
    name: lexfinance-web
    env: node
    plan: free # ou starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexfinance-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_NAME
        value: Lima Advocacia e Associados
