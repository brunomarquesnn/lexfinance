databases:
  - name: lexfinance-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: lexfinance-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexfinance-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_NAME
        value: Lima Advocacia e Associados
