<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Shield body -->
  <path d="M100 10 L170 45 L170 120 Q170 170 100 210 Q30 170 30 120 L30 45 Z" 
        stroke="currentColor" stroke-width="6" fill="none" stroke-linejoin="round"/>
  
  <!-- Inner vertical line (sword/pillar) -->
  <line x1="100" y1="55" x2="100" y2="175" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Scale crossbar -->
  <line x1="60" y1="80" x2="140" y2="80" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Scale top (balance point) -->
  <path d="M90 55 L100 40 L110 55" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left scale pan -->
  <path d="M60 80 L50 110 Q65 120 80 110 L70 80" stroke="currentColor" stroke-width="4" fill="none" stroke-linejoin="round"/>
  
  <!-- Right scale pan -->
  <path d="M130 80 L120 110 Q135 120 150 110 L140 80" stroke="currentColor" stroke-width="4" fill="none" stroke-linejoin="round"/>
  
  <!-- Inner shield decorative lines (leaf/branch motif) -->
  <path d="M70 130 Q85 145 100 130" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M100 130 Q115 145 130 130" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Base decoration -->
  <path d="M80 160 L100 175 L120 160" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
